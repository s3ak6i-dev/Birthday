<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FR-01 (masterdoc.md): privacy comes from the URL being unlisted
         and noindex, not from anything requiring a login. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Chandra's Waiting Room</title>
    <!-- index.css's font-family stack has named "Pixelify Sans" since early
         on, but nothing ever actually loaded it - every screen has been
         silently falling back to the generic monospace stack. This is the
         fix. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
