name = "ward-games-rooms"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# One Durable Object per live room (masterdoc.md section 4.6).
[[durable_objects.bindings]]
name = "WARD_ROOM"
class_name = "WardRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WardRoom"]

# No secrets needed here - JWT verification uses Supabase's public JWKS
# endpoint (jwt.ts), not a shared secret. See masterdoc.md section 12.2 for
# the full environment variable table.
[vars]
# Comma-separated, checked in index.ts's onBeforeConnect. Several local
# ports listed, not just 5173 - Vite auto-increments to 5174/5175/etc.
# whenever the canonical port's already in use by another dev session, so
# a single hardcoded local port kept breaking local multiplayer testing
# for no real security benefit (still just localhost either way).
ALLOWED_ORIGIN = "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,https://drchandraswaitingroom.vercel.app"
SUPABASE_URL = "https://lyappvibyxgtcnqravog.supabase.co"
